<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ควงควงมินิมาร์ท</title>

<style>
body{margin:0;font-family:Arial;background:#f8f7f4;padding-bottom:90px}
.container{max-width:1000px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;border-radius:15px;padding:10px}
.qtyrow button{width:30px;height:30px}
.cartbar{position:fixed;bottom:0;width:100%;background:#222;color:#fff;padding:10px}
</style>
</head>

<body>

<div class="container">
<h2>ควงควงมินิมาร์ท</h2>

<div class="grid" id="productGrid"></div>

<h3>รวม: <span id="total">0</span> บาท</h3>

<label>วิธีรับสินค้า</label>
<select id="deliveryType" onchange="updateTotal()">
<option value="delivery">จัดส่ง (คำนวณค่าส่งอัตโนมัติ)</option>
<option value="pickup">รับหน้าร้าน</option>
</select>

<div style="font-size:12px;color:#555;margin-top:8px">
🛵 ค่าส่ง:
<br>09:00–00:00 → ครบ 100 ส่งฟรี / ไม่ครบ 10 บาท
<br>00:01–08:59 → ครบ 100 = 15 บาท / ไม่ครบ 20 บาท
</div>

</div>

<script>

const products = [
{ id:'W001', name:'น้ำเปล่า', price:10, stock:10 },
{ id:'W002', name:'โค้ก', price:20, stock:0 },
{ id:'W003', name:'มาม่า', price:7, stock:5 },
];

const cart = {};

// 🔥 ค่าส่งตามเวลา
function fee(){
  if(document.getElementById('deliveryType').value === 'pickup') return 0;

  const total = subtotal();
  const now = new Date();
  const time = now.getHours()*60 + now.getMinutes();

  if(time >= 9*60){
    return total >= 100 ? 0 : 10;
  }
  return total >= 100 ? 15 : 20;
}

function subtotal(){
  return Object.values(cart).reduce((a,b)=>a+b,0);
}

// 🔥 render สินค้า
function render(){
  document.getElementById('productGrid').innerHTML = products.map(p=>{
    const status = p.stock<=0 ? "หมด" : "พร้อมจำหน่าย";

    return `
    <div class="card">
      <div>${p.name}</div>
      <div style="color:${p.stock<=0?'red':'green'}">${status}</div>
      <div>${p.price} บาท</div>

      <div class="qtyrow">
        <button onclick="add('${p.id}')" ${p.stock<=0?'disabled':''}>+</button>
      </div>
    </div>
    `
  }).join('');
}

// 🔥 เพิ่มสินค้า
function add(id){
  const p = products.find(x=>x.id===id);

  if(p.stock<=0){
    alert('สินค้าหมด');
    return;
  }

  if(cart[id] && cart[id] >= p.stock){
    alert('สินค้าไม่พอ');
    return;
  }

  cart[id] = (cart[id]||0) + p.price;

  updateTotal();
}

// 🔥 อัปเดตราคา
function updateTotal(){
  document.getElementById('total').innerText = subtotal() + fee();
}

render();

</script>

</body>
</html>
